# jobwatch config
# Edit this file to change what you get pinged about. Patterns are case-insensitive regex.

min_rating = 3.8         # companies below this Glassdoor rating are skipped (not even fetched)
max_pushes_per_run = 8    # cap phone notifications per hourly run; the rest go in the email digest

# Resume fit: each keyword found in a posting's title or description adds its weight (once).
# Tuned to my resume. Negative weights = stacks he doesn't use.
[fit]
recent_days = 21          # best_fits.txt lists roles posted within this many days
keywords = [
  ['\bjava\b', 3], ['kafka', 3], ['apache camel|\bcamel\b', 3], ['integration', 3], ['microservice', 2],
  ['spring', 2], ['rest(ful)? api|\bapis?\b', 2], ['event[- ]driven', 2], ['typescript', 2], ['\breact\b', 2],
  ['node\.?js|\bnode\b', 2], ['\baws\b|amazon web services', 2], ['lambda', 2], ['micro[- ]?frontend', 2],
  ['insurance|insurtech', 3], ['guidewire|policycenter', 4], ['\bllm|agentic|\bagents?\b|generative ai|genai|claude|ai-assisted', 2],
  ['golang|\bgo\b', 1], ['python', 1], ['postgres|\bsql\b', 1], ['docker|kubernetes', 1], ['ci/cd|jenkins|github actions', 1],
  ['identity|access management|\biam\b|provisioning', 2], ['payments?|fintech|banking', 1],
  ['c\+\+', -3], ['\brust\b', -2], ['\bruby\b|rails', -2], ['\bscala\b', -1], ['elixir|haskell|clojure|ocaml', -2],
]

[filters]
# Alert only on postings first published within this many days.
# Old postings and "reposted" roles never alert.
max_age_days = 3

# Title must match at least one of these...
title_include = [
  'software (engineer|developer)',
  '\bSWE\b',
  'back[- ]?end',
  'full[- ]?stack',
  'java (engineer|developer)',
  'platform engineer',
  'product engineer',
  'integration(s)? engineer',
  'api engineer',
  'front[- ]?end', 'web (engineer|developer)', '\bui engineer', 'react',
  # same job, different names
  'software development engineer', '\bsde\b', 'member of technical staff', '\bmts\b',
  '^((senior|sr\.?) )?engineer\b', '\bengineer (i{1,3}|[123])\b',
  # coding roles at AI companies (agents, applied AI, deployed engineering)
  '\bai engineer', 'applied ai', 'deployed engineer', 'agent (deployment )?engineer',
]

# ...and none of these (seniority you're not targeting yet, or a different job family).
title_exclude = [
  '(?<!technical )\bstaff\b', '\bprincipal\b', '\blead\b', '\bdistinguished\b',
  '\bmanager\b', '\bdirector\b', '\bhead of\b', '\bvp\b', '\barchitect\b',
  '(?<!assistant )vice president', '\b[slp]mts\b', '\bcontract\b',
  '\bIV\b', '\bV\b', 'level 5', 'level 6',
  '\bintern(ship)?\b', 'new grad', 'university', 'apprentice', 'co-?op\b', '\bcampus\b',
  'college grad', '\bamts\b',
  'technical leader', '\bleader\b',
  '\b(android|ios|mobile)\b',
  'machine learning', '\bml\b', 'research', 'data scien',
  '\bsales\b', 'solutions? (engineer|architect|consultant)', 'support engineer',
  'customer (engineer|success)', 'legal engineer', 'quantitative', 'security engineer',
  'site reliability', '\bsre\b', 'infrastructure engineer', 'mainframe',
  'embedded', 'firmware', 'hardware',
]

# "Senior" titles are allowed only when the posting asks for at most this many years.
stretch_titles = ['\bsenior\b', '\bsr\.?\b']
stretch_max_years = 3
# Non-senior titles are dropped when the posting asks for more than this many years.
max_years_required = 4

# On-site/hybrid locations you'd commute to.
locations_local = [
  # NYC + NJ
  'new york', '\bnyc\b', 'brooklyn', 'new jersey', '\bnj\b',
  'jersey city', 'hoboken', 'newark', 'princeton', 'pennington', 'parsippany', 'morristown',
  'basking ridge', 'iselin', 'edison', 'piscataway', 'new brunswick', 'rahway', 'whippany',
  'florham park', 'bridgewater', 'raritan', 'secaucus', 'weehawken', 'holmdel', 'red bank',
  'mount laurel', 'trenton', 'summit',
  # Wider commute: Philadelphia area, Westchester NY, Fairfield County CT
  'philadelphia', 'exton', 'king of prussia', 'conshohocken', 'malvern', 'radnor', 'horsham',
  'fort washington', 'wayne, pa', 'westchester', 'white plains', 'purchase', 'rye brook',
  'tarrytown', 'armonk', 'stamford', 'greenwich', 'norwalk',
]

# Remote roles are accepted if they're US-eligible.
allow_remote_us = true
us_markers = ['united states', '\bus\b', '\busa\b', 'u\.s\.', 'north america', '\bamericas\b']
non_us_markers = [
  'canada', 'toronto', 'vancouver', 'montreal', 'waterloo', 'ontario', 'british columbia',
  'quebec', 'alberta', 'calgary', 'ottawa',
  '\buk\b', 'united kingdom', 'london', 'ireland', 'dublin', 'europe', '\bemea\b',
  'germany', 'berlin', 'france', 'paris', 'netherlands', 'amsterdam', 'spain', 'madrid',
  'barcelona', 'poland', 'warsaw', 'portugal', 'lisbon', 'india', 'bengaluru', 'bangalore',
  'hyderabad', 'pune', 'singapore', 'japan', 'tokyo', 'australia', 'sydney', 'brazil',
  's[aã]o paulo', 'mexico', '\blatam\b', 'argentina', 'colombia', 'israel', 'tel aviv',
  '\bapac\b', 'philippines', 'austria', 'vienna', 'switzerland', 'zurich', '\bzug\b', 'heidelberg',
  'munich', 'belgium', 'brussels', 'denmark', 'copenhagen', 'sweden', 'stockholm', 'norway', 'oslo',
  'finland', 'helsinki', 'italy', 'milan', 'czech', 'prague', 'romania', 'hungary', 'budapest',
  'greece', 'athens', 'bulgaria', 'sofia', 'croatia', 'serbia', 'belgrade', 'ukraine', 'kyiv',
  'turkey', 'istanbul', 'egypt', 'nigeria', 'lagos', 'kenya', 'south africa', 'dubai', '\buae\b',
  'saudi', 'qatar', 'pakistan', 'china', 'beijing', 'shanghai', 'shenzhen', 'hong kong', 'taiwan',
  'taipei', 'korea', 'seoul', 'vietnam', 'malaysia', 'kuala lumpur', 'indonesia', 'jakarta',
  'thailand', 'bangkok', 'new zealand', 'chile', 'santiago', 'peru', 'uruguay', 'costa rica',
  'heredia', 'guatemala', 'manila', 'cebu', 'gurugram', 'gurgaon', 'noida', 'chennai', 'mumbai',
  'delhi', 'krakow', 'wroclaw', 'edinburgh', 'manchester', 'belfast', 'cambridge, uk', 'tel aviv',
]

# Place names that contain a local keyword but aren't commutable (e.g. "Rochester, New York").
locations_exclude = ['rochester', 'buffalo', 'syracuse', 'albany', 'ithaca', 'binghamton', 'utica',
  'schenectady', 'poughkeepsie', 'pittsburgh', 'harrisburg', 'allentown']

